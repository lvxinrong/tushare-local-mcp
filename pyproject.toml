[project]
name = "tushare-local-mcp"
version = "0.1.0"
description = "Local MCP server for exposing Tushare data tools."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "lv" },
]
keywords = ["mcp", "tushare", "finance", "stock", "quant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp>=1.8.0",
    "python-dotenv>=1.0.0",
    "tushare>=1.4.0",
]

[project.scripts]
tushare-local-mcp = "tushare_local_mcp.server:main"

[dependency-groups]
dev = [
    "pytest-asyncio>=0.23.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tushare_local_mcp"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
